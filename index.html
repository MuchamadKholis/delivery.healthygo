<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Kurir Terpadu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 font-sans" x-data="app()" x-init="initData()">

    <!-- ================= HALAMAN LOGIN ================= -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-blue-600 px-4">
            <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
                <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">KurirApp Login</h2>
                
                <div class="flex border-b mb-6">
                    <button @click="loginRole = 'admin'; loginError = ''" :class="loginRole === 'admin' ? 'border-blue-600 text-blue-600 font-bold' : 'border-transparent text-gray-500'" class="w-1/2 pb-2 border-b-2 text-sm text-center">Admin</button>
                    <button @click="loginRole = 'kurir'; loginError = ''" :class="loginRole === 'kurir' ? 'border-blue-600 text-blue-600 font-bold' : 'border-transparent text-gray-500'" class="w-1/2 pb-2 border-b-2 text-sm text-center">Kurir / Pegawai</button>
                </div>

                <form @submit.prevent="handleLogin" class="space-y-4">
                    <template x-if="loginRole === 'admin'">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username Admin</label>
                            <input type="text" x-model="loginInput.username" placeholder="Masukkan username" required class="w-full border rounded px-3 py-2 text-sm">
                            <label class="block text-sm font-medium text-gray-700 mt-3 mb-1">Password</label>
                            <input type="password" x-model="loginInput.password" placeholder="Masukkan password" required class="w-full border rounded px-3 py-2 text-sm">
                        </div>
                    </template>

                    <template x-if="loginRole === 'kurir'">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username Anda</label>
                            <input type="text" x-model="loginInput.kurirUsername" placeholder="Masukkan username" required class="w-full border rounded px-3 py-2 text-sm mb-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input type="password" x-model="loginInput.kurirPassword" placeholder="Masukkan password" required class="w-full border rounded px-3 py-2 text-sm">
                        </div>
                    </template>

                    <p class="text-xs text-red-500 font-semibold" x-text="loginError" x-show="loginError"></p>

                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded text-sm font-semibold hover:bg-blue-700 mt-2">Masuk (Login)</button>
                </form>
            </div>
        </div>
    </template>

    <!-- ================= HALAMAN UTAMA SETELAH LOGIN ================= -->
    <template x-if="isLoggedIn">
        <div>
            <!-- Navbar -->
            <nav class="bg-blue-600 text-white shadow-lg">
                <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                    <h1 class="text-xl font-bold">KurirApp v1.0 (Cloud Database)</h1>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm bg-blue-700 px-3 py-1 rounded-full" x-text="role === 'admin' ? 'Administrator' : currentUser.name + ' (' + currentUser.kontrak + ' - ' + currentUser.jabatan + ')'"></span>
                        <button @click="logout()" class="bg-red-500 text-white px-3 py-1 rounded text-sm font-semibold hover:bg-red-600">Logout</button>
                    </div>
                </div>
            </nav>

            <div class="container mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">

                <!-- Sidebar / Menu -->
                <div class="w-full md:w-1/4 bg-white p-4 rounded-lg shadow h-fit">
                    <h2 class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-3">Menu Navigasi</h2>
                    <ul class="space-y-2 text-sm">
                        <template x-if="role === 'admin'">
                            <div class="space-y-1">
                                <li><button @click="changeTab('admin-kurir')" :class="activeTab === 'admin-kurir' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">👥 Kelola Pegawai</button></li>
                                <li><button @click="changeTab('admin-jabatan')" :class="activeTab === 'admin-jabatan' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">🏷️ Master Jabatan</button></li>
                                <li><button @click="changeTab('admin-estafet-area')" :class="activeTab === 'admin-estafet-area' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">📍 Master Estafet Area</button></li>
                                <hr class="my-2">
                                <p class="text-xs text-gray-400 px-3 uppercase tracking-wider font-bold">Rekapitulasi (Auto-Sync)</p>
                                <li><button @click="changeTab('rekap-absen')" :class="activeTab === 'rekap-absen' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">📍 Absensi (Harian)</button></li>
                                <li><button @click="changeTab('rekap-parkir')" :class="activeTab === 'rekap-parkir' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">🅿️ Parkir</button></li>
                                <li><button @click="changeTab('rekap-gedung')" :class="activeTab === 'rekap-gedung' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">🏢 Gedung</button></li>
                                <li><button @click="changeTab('rekap-estafet')" :class="activeTab === 'rekap-estafet' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">🔄 Estafet</button></li>
                                <li><button @click="changeTab('rekap-jarak')" :class="activeTab === 'rekap-jarak' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">📏 Jarak</button></li>
                                <li><button @click="changeTab('rekap-pickup')" :class="activeTab === 'rekap-pickup' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">📦 Ambil Barang</button></li>
                            </div>
                        </template>
                        <template x-if="role === 'kurir'">
                            <div class="space-y-1">
                                <li><button @click="changeTab('kurir-absen')" :class="activeTab === 'kurir-absen' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">📍 Absensi Harian</button></li>
                                <hr class="my-2">
                                <p class="text-xs text-gray-400 px-3 uppercase tracking-wider font-bold">Tugas & Klaim</p>
                                <li><button @click="changeTab('kurir-parkir')" :class="activeTab === 'kurir-parkir' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">🅿️ Parkir & Reimburse</button></li>
                                <li><button @click="changeTab('kurir-gedung')" :class="activeTab === 'kurir-gedung' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">🏢 Gedung</button></li>
                                <li><button @click="changeTab('kurir-estafet')" :class="activeTab === 'kurir-estafet' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">🔄 Estafet</button></li>
                                <li><button @click="changeTab('kurir-jarak')" :class="activeTab === 'kurir-jarak' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">📏 Jarak</button></li>
                                <li><button @click="changeTab('kurir-pickup')" :class="activeTab === 'kurir-pickup' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600'" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50">📦 Ambil Barang</button></li>
                            </div>
                        </template>
                    </ul>
                </div>

                <!-- Main Content Area -->
                <div class="w-full md:w-3/4 space-y-4">

                    <!-- Loading Indicator -->
                    <div x-show="isLoading" class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 rounded shadow text-sm font-semibold flex items-center justify-between">
                        <span>⏳ Sedang memproses data & mengunggah foto ke Google Drive... Mohon tunggu.</span>
                    </div>

                    <!-- ================= FILTER ADMIN ================= -->
                    <template x-if="role === 'admin' && activeTab.startsWith('rekap-')">
                        <div class="bg-white p-4 rounded-lg shadow grid grid-cols-1 md:grid-cols-5 gap-3 text-sm">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Filter Tanggal</label>
                                <input type="date" x-model="filters.tanggal" class="w-full border rounded px-2 py-1">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Cari Nama</label>
                                <input type="text" x-model="filters.nama" placeholder="Nama..." class="w-full border rounded px-2 py-1">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Kontrak</label>
                                <select x-model="filters.kontrak" class="w-full border rounded px-2 py-1">
                                    <option value="">Semua Kontrak</option>
                                    <option value="Full Time">Full Time</option>
                                    <option value="Part Time">Part Time</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Jabatan</label>
                                <select x-model="filters.jabatan" class="w-full border rounded px-2 py-1">
                                    <option value="">Semua Jabatan</option>
                                    <template x-for="jab in jabatanList"><option :value="jab" x-text="jab"></option></template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Status</label>
                                <select x-model="filters.status" class="w-full border rounded px-2 py-1">
                                    <option value="">Semua Status</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Approved">Approved</option>
                                    <option value="Rejected">Rejected</option>
                                </select>
                            </div>
                        </div>
                    </template>

                    <!-- ADMIN: KELOLA PEGAWAI -->
                    <div x-show="role === 'admin' && activeTab === 'admin-kurir'" class="space-y-6">
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h2 class="text-lg font-bold mb-4 text-gray-800">Tambah Pegawai Baru</h2>
                            <form @submit.prevent="saveKurir" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label><input type="text" x-model="kurirForm.name" required class="w-full border rounded px-3 py-2 text-sm"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Username Login</label><input type="text" x-model="kurirForm.username" required class="w-full border rounded px-3 py-2 text-sm"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Password</label><input type="password" x-model="kurirForm.password" required class="w-full border rounded px-3 py-2 text-sm"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Kontrak</label><select x-model="kurirForm.kontrak" class="w-full border rounded px-3 py-2 text-sm"><option value="Full Time">Full Time</option><option value="Part Time">Part Time</option></select></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Jabatan</label><select x-model="kurirForm.jabatan" class="w-full border rounded px-3 py-2 text-sm"><template x-for="jab in jabatanList"><option :value="jab" x-text="jab"></option></template></select></div>
                                <div class="flex items-end"><button type="submit" class="w-full bg-blue-600 text-white py-2 rounded text-sm font-semibold hover:bg-blue-700">Simpan</button></div>
                            </form>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="font-semibold text-gray-700 mb-3">Daftar Pegawai Terdaftar</h3>
                            <table class="w-full text-left border-collapse text-sm">
                                <thead><tr class="bg-gray-50 border-b"><th class="p-3">Nama & Username</th><th class="p-3">Jabatan</th><th class="p-3">Kontrak</th><th class="p-3">Aksi</th></tr></thead>
                                <tbody>
                                    <template x-for="(k, index) in kurirList" :key="index">
                                        <tr class="border-b hover:bg-gray-50">
                                            <td class="p-3"><div class="font-medium" x-text="k.name"></div><div class="text-xs text-gray-500" x-text="'Username: ' + k.username"></div></td>
                                            <td class="p-3" x-text="k.jabatan"></td>
                                            <td class="p-3" x-text="k.kontrak"></td>
                                            <td class="p-3"><button @click="deleteKurir(index)" class="bg-red-500 text-white px-3 py-1 rounded text-xs font-semibold">Hapus</button></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- ADMIN: MASTER JABATAN -->
                    <div x-show="role === 'admin' && activeTab === 'admin-jabatan'" class="bg-white p-6 rounded-lg shadow">
                        <h2 class="text-lg font-bold mb-4 text-gray-800">Kelola Master Jabatan</h2>
                        <form @submit.prevent="saveJabatan" class="flex gap-4 mb-6 pb-6 border-b">
                            <input type="text" x-model="jabatanForm.name" placeholder="Nama Jabatan" required class="flex-1 border rounded px-3 py-2 text-sm">
                            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded text-sm font-semibold">Tambah</button>
                        </form>
                        <table class="w-full text-left border-collapse text-sm">
                            <thead><tr class="bg-gray-50 border-b"><th class="p-3">No</th><th class="p-3">Nama Jabatan</th><th class="p-3">Aksi</th></tr></thead>
                            <tbody>
                                <template x-for="(jab, index) in jabatanList" :key="index">
                                    <tr class="border-b hover:bg-gray-50">
                                        <td class="p-3" x-text="index + 1"></td>
                                        <td class="p-3 font-medium" x-text="jab"></td>
                                        <td class="p-3"><button @click="deleteJabatan(index)" class="bg-red-500 text-white px-3 py-1 rounded text-xs">Hapus</button></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- ADMIN: MASTER ESTAFET AREA -->
                    <div x-show="role === 'admin' && activeTab === 'admin-estafet-area'" class="bg-white p-6 rounded-lg shadow">
                        <h2 class="text-lg font-bold mb-4 text-gray-800">Kelola Master Estafet Area</h2>
                        <form @submit.prevent="saveEstafetArea" class="flex gap-4 mb-6 pb-6 border-b">
                            <input type="text" x-model="estafetAreaForm.name" placeholder="Nama Area Estafet" required class="flex-1 border rounded px-3 py-2 text-sm">
                            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded text-sm font-semibold">Tambah</button>
                        </form>
                        <table class="w-full text-left border-collapse text-sm">
                            <thead><tr class="bg-gray-50 border-b"><th class="p-3">No</th><th class="p-3">Nama Area</th><th class="p-3">Aksi</th></tr></thead>
                            <tbody>
                                <template x-for="(area, index) in estafetAreaList" :key="index">
                                    <tr class="border-b hover:bg-gray-50">
                                        <td class="p-3" x-text="index + 1"></td>
                                        <td class="p-3 font-medium" x-text="area"></td>
                                        <td class="p-3"><button @click="deleteEstafetArea(index)" class="bg-red-500 text-white px-3 py-1 rounded text-xs">Hapus</button></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- ADMIN: REKAPITULASI ABSENSI -->
                    <div x-show="role === 'admin' && activeTab === 'rekap-absen'" class="bg-white p-6 rounded-lg shadow space-y-4">
                        <h2 class="text-lg font-bold text-gray-800">Rekapitulasi: Absensi Harian</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-gray-50 border-b">
                                        <th class="p-3">Tanggal</th><th class="p-3">Nama</th><th class="p-3">Kontrak</th><th class="p-3">Jabatan</th>
                                        <th class="p-3">Datang</th><th class="p-3">Foto Datang</th><th class="p-3">Pulang</th><th class="p-3">Foto Pulang</th><th class="p-3">Status</th><th class="p-3">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="rec in filteredAbsen" :key="rec.key">
                                        <tr class="border-b hover:bg-gray-50 align-middle">
                                            <td class="p-3 font-semibold text-gray-600" x-text="rec.date"></td>
                                            <td class="p-3 font-medium" x-text="rec.name"></td>
                                            <td class="p-3" x-text="rec.kontrak"></td>
                                            <td class="p-3" x-text="rec.jabatan"></td>
                                            <td class="p-3 text-xs text-blue-600" x-text="rec.timeDatang || '-'"></td>
                                            <td class="p-3"><template x-if="rec.photoDatang && rec.photoDatang !== '-'"><a :href="rec.photoDatang" target="_blank" class="text-blue-600 underline text-xs">Lihat</a></template><template x-if="!rec.photoDatang || rec.photoDatang === '-'">-</template></td>
                                            <td class="p-3 text-xs text-blue-600" x-text="rec.timePulang || '-'"></td>
                                            <td class="p-3"><template x-if="rec.photoPulang && rec.photoPulang !== '-'"><a :href="rec.photoPulang" target="_blank" class="text-blue-600 underline text-xs">Lihat</a></template><template x-if="!rec.photoPulang || rec.photoPulang === '-'">-</template></td>
                                            <td class="p-3"><span class="px-2 py-1 rounded text-xs font-semibold" :class="rec.status === 'Approved' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'" x-text="rec.status"></span></td>
                                            <td class="p-3 space-x-1">
                                                <button @click="updateStatus('absen', rec.rowIndexDatang || rec.rowIndexPulang, 'Approved')" class="bg-green-500 text-white px-2 py-1 rounded text-xs">Approve</button>
                                                <button @click="updateStatus('absen', rec.rowIndexDatang || rec.rowIndexPulang, 'Rejected')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Reject</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- ADMIN: REKAPITULASI PARKIR -->
                    <div x-show="role === 'admin' && activeTab === 'rekap-parkir'" class="bg-white p-6 rounded-lg shadow space-y-4">
                        <h2 class="text-lg font-bold text-gray-800">Rekapitulasi: Reimburse Parkir</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead><tr class="bg-gray-50 border-b"><th class="p-3">Tanggal</th><th class="p-3">Nama</th><th class="p-3">Kontrak</th><th class="p-3">Jabatan</th><th class="p-3">Foto Karcis</th><th class="p-3">Nominal (Rp)</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead>
                                <tbody>
                                    <template x-for="row in filteredCloud('parkir')" :key="row.index">
                                        <tr class="border-b hover:bg-gray-50">
                                            <td class="p-3" x-text="row.data[0]"></td>
                                            <td class="p-3 font-medium" x-text="row.data[1]"></td>
                                            <td class="p-3" x-text="row.data[2]"></td>
                                            <td class="p-3" x-text="row.data[3]"></td>
                                            <td class="p-3"><template x-if="row.data[4] && row.data[4] !== '-'"><a :href="row.data[4]" target="_blank" class="text-blue-600 underline text-xs">Lihat</a></template></td>
                                            <td class="p-3"><input type="number" x-model.number="row.data[5]" @change="updateStatus('parkir', row.index, null, row.data[5])" class="border rounded px-2 py-1 w-24 text-sm font-bold"></td>
                                            <td class="p-3"><span class="px-2 py-1 rounded text-xs font-semibold" :class="row.data[6] === 'Approved' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'" x-text="row.data[6]"></span></td>
                                            <td class="p-3 space-x-1">
                                                <button @click="updateStatus('parkir', row.index, 'Approved')" class="bg-green-500 text-white px-2 py-1 rounded text-xs">Approve</button>
                                                <button @click="updateStatus('parkir', row.index, 'Rejected')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Reject</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- ADMIN: REKAPITULASI GEDUNG -->
                    <div x-show="role === 'admin' && activeTab === 'rekap-gedung'" class="bg-white p-6 rounded-lg shadow space-y-4">
                        <h2 class="text-lg font-bold text-gray-800">Rekapitulasi: Kirim ke Gedung</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead><tr class="bg-gray-50 border-b"><th class="p-3">Tanggal</th><th class="p-3">Nama</th><th class="p-3">Gedung & Lantai</th><th class="p-3">Customer</th><th class="p-3">Sesi</th><th class="p-3">Foto</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead>
                                <tbody>
                                    <template x-for="row in filteredCloud('gedung')" :key="row.index">
                                        <tr class="border-b hover:bg-gray-50">
                                            <td class="p-3" x-text="row.data[0]"></td>
                                            <td class="p-3 font-medium" x-text="row.data[1]"></td>
                                            <td class="p-3" x-text="row.data[4]"></td>
                                            <td class="p-3" x-text="row.data[5]"></td>
                                            <td class="p-3 text-blue-600 font-semibold" x-text="row.data[6]"></td>
                                            <td class="p-3"><template x-if="row.data[7] && row.data[7] !== '-'"><a :href="row.data[7]" target="_blank" class="text-blue-600 underline text-xs">Lihat</a></template></td>

    <!-- Script Logika -->
    <script>
        function app() {
            return {
                isLoggedIn: false,
                loginRole: 'admin',
                loginInput: { username: '', password: '', kurirUsername: '', kurirPassword: '' },
                loginError: '',
                isLoading: false,
                autoRefreshInterval: null,
                gasUrl: 'https://script.google.com/macros/s/AKfycbxOD6MbCj86o2-ycoJ3MI49Znu0xd6ryofeqcO7fkec-nqLSfnnlX3mTaz__agFjt-BFA/exec',

                role: '', 
                activeTab: 'admin-kurir',

                filters: { tanggal: '', nama: '', kontrak: '', jabatan: '', status: '' },

                jabatanList: JSON.parse(localStorage.getItem('jabatanList')) || ['Kurir', 'Driver', 'Korlap'],
                jabatanForm: { name: '' },
                estafetAreaList: JSON.parse(localStorage.getItem('estafetAreaList')) || ['Zona Pusat', 'Zona Utara'],
                estafetAreaForm: { name: '' },
                kurirList: JSON.parse(localStorage.getItem('kurirList')) || [
                    { name: 'Budi Santoso', username: 'budi', password: '123', kontrak: 'Full Time', jabatan: 'Kurir' }
                ],
                currentUser: {},
                kurirForm: { name: '', username: '', password: '', kontrak: 'Full Time', jabatan: 'Kurir' },
                
                absenForm: { type: 'Absen Datang', capturedImage: null },
                parkirForm: { tanggal: '', nominal: 2000, photo: null },
                gedungForm: { tanggal: '', gedungLantai: '', namaCust: '', sesi: 'Lunch', photo: null },
                estafetForm: { tanggal: '', estafetArea: '', alasan: '', photo: null },
                jarakForm: { tanggal: '', sesi: 'Lunch', custTerjauh: '', jarak: '', photoBox: '', photoBukti: '' },
                pickupForm: { tanggal: '', deskripsi: '', photo: null },

                cloudSheets: { absen: [], parkir: [], gedung: [], estafet: [], jarak: [], 'ambil barang': [] },

                stopCamera() {
                    const video = document.getElementById('cameraStream');
                    if (video && video.srcObject) {
                        let tracks = video.srcObject.getTracks();
                        tracks.forEach(track => track.stop());
                        video.srcObject = null;
                    }
                },

                changeTab(tab) {
                    if (this.activeTab === 'kurir-absen' && tab !== 'kurir-absen') this.stopCamera();
                    this.activeTab = tab;
                    if (this.role === 'admin') this.fetchCloudData();
                    if (tab === 'kurir-absen') this.initCamera();
                },

                async fetchCloudData() {
                    try {
                        let res = await fetch(this.gasUrl + "?action=getData");
                        let data = await res.json();
                        this.cloudSheets = data;
                    } catch (err) {
                        console.error("Gagal menarik data cloud:", err);
                    }
                },

                async sendToGoogleSheets(sheetType, payloadData) {
                    this.isLoading = true;
                    try {
                        await fetch(this.gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify({ sheetType: sheetType, ...payloadData })
                        });
                        this.isLoading = false;
                        alert('Berhasil dikirim ke Google Spreadsheet & Drive!');
                        this.fetchCloudData();
                        return true;
                    } catch (error) {
                        this.isLoading = false;
                        alert("Gagal mengirim ke server.");
                        return false;
                    }
                },

                async updateStatus(sheetName, rowIndex, newStatus, newNominal = null) {
                    this.isLoading = true;
                    try {
                        await fetch(this.gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify({ action: 'updateStatus', sheetName: sheetName, rowIndex: rowIndex, status: newStatus, nominal: newNominal })
                        });
                        this.isLoading = false;
                        alert('Berhasil diperbarui!');
                        this.fetchCloudData();
                    } catch (err) {
                        this.isLoading = false;
                        alert('Gagal memperbarui status.');
                    }
                },

                initData() {
                    if (this.role === 'admin') {
                        this.fetchCloudData();
                        this.autoRefreshInterval = setInterval(() => { if (this.role === 'admin') this.fetchCloudData(); }, 10000);
                    }
                },

                initCamera() {
                    setTimeout(() => {
                        const video = document.getElementById('cameraStream');
                        if (video) {
                            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                                .then(stream => { video.srcObject = stream; })
                                .catch(err => { console.log("Kamera error: ", err); });
                        }
                    }, 300);
                },

                async takeSnapshot() {
                    const video = document.getElementById('cameraStream');
                    const canvas = document.getElementById('snapshotCanvas');
                    if (video && canvas) {
                        canvas.width = video.videoWidth || 320;
                        canvas.height = video.videoHeight || 240;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        this.absenForm.capturedImage = canvas.toDataURL('image/jpeg', 0.8);
                    }
                },

                retakeSnapshot() {
                    this.absenForm.capturedImage = null;
                    this.initCamera();
                },

                async handleFileUpload(event, type) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            let res = e.target.result;
                            if (type === 'parkir') this.parkirForm.photo = res;
                            if (type === 'gedung') this.gedungForm.photo = res;
                            if (type === 'estafet') this.estafetForm.photo = res;
                            if (type === 'jarakBox') this.jarakForm.photoBox = res;
                            if (type === 'jarakBukti') this.jarakForm.photoBukti = res;
                            if (type === 'pickup') this.pickupForm.photo = res;
                        };
                        reader.readAsDataURL(file);
                    }
                },

                handleLogin() {
                    this.loginError = '';
                    if (this.loginRole === 'admin') {
                        if (this.loginInput.username === 'admin' && this.loginInput.password === 'admin123') {
                            this.role = 'admin';
                            this.isLoggedIn = true;
                            this.activeTab = 'admin-kurir';
                            this.initData();
                        } else {
                            this.loginError = 'Username atau Password Admin salah!';
                        }
                    } else {
                        const found = this.kurirList.find(k => k.username.toLowerCase() === this.loginInput.kurirUsername.toLowerCase());
                        if (found && found.password === this.loginInput.kurirPassword) {
                            this.role = 'kurir';
                            this.currentUser = found;
                            this.isLoggedIn = true;
                            this.activeTab = 'kurir-absen';
                            this.initCamera();
                        } else {
                            this.loginError = 'Username atau Password salah!';
                        }
                    }
                },

                logout() {
                    this.stopCamera();
                    if (this.autoRefreshInterval) clearInterval(this.autoRefreshInterval);
                    this.isLoggedIn = false;
                },

                // Fitur Filter Global untuk Data Cloud Sheets
                filteredCloud(sheetName) {
                    let rows = this.cloudSheets[sheetName] || [];
                    if (rows.length <= 1) return [];
                    let result = [];
                    for (let i = 1; i < rows.length; i++) {
                        let r = rows[i];
                        let tgl = r[0], nama = r[1], kontrak = r[2], jabatan = r[3], status = r[r.length - 1];
                        
                        if (this.filters.tanggal && tgl !== this.filters.tanggal) continue;
                        if (this.filters.nama && !nama.toLowerCase().includes(this.filters.nama.toLowerCase())) continue;
                        if (this.filters.kontrak && kontrak !== this.filters.kontrak) continue;
                        if (this.filters.jabatan && jabatan !== this.filters.jabatan) continue;
                        if (this.filters.status && status !== this.filters.status) continue;

                        result.push({ index: i + 1, data: r });
                    }
                    return result;
                },

                get filteredAbsen() {
                    let rows = this.cloudSheets.absen || [];
                    if (rows.length <= 1) return [];
                    let map = {};
                    for (let i = 1; i < rows.length; i++) {
                        let r = rows[i];
                        let tgl = r[0], name = r[1], kontrak = r[2], jabatan = r[3], absenType = r[4], foto = r[5], waktu = r[4], status = r[8] || 'Pending';
                        let key = `${name}_${tgl}`;
                        if (!map[key]) {
                            map[key] = { key: key, date: tgl, name: name, kontrak: kontrak, jabatan: jabatan, timeDatang: null, photoDatang: null, timePulang: null, photoPulang: null, status: status, rowIndexDatang: null, rowIndexPulang: null };
                        }
                        if (absenType === 'Absen Datang' || r[4]) { 
                            // Deteksi kolom absen
                            map[key].timeDatang = r[4]; map[key].photoDatang = r[5]; map[key].rowIndexDatang = i + 1;
                        }
                        if (absenType === 'Absen Pulang' || r[6]) {
                            map[key].timePulang = r[6]; map[key].photoPulang = r[7]; map[key].rowIndexPulang = i + 1;
                        }
                        if(r[8]) map[key].status = r[8];
                    }

                    return Object.values(map).filter(rec => {
                        if (this.filters.tanggal && rec.date !== this.filters.tanggal) return false;
                        if (this.filters.nama && !rec.name.toLowerCase().includes(this.filters.nama.toLowerCase())) return false;
                        if (this.filters.kontrak && rec.kontrak !== this.filters.kontrak) return false;
                        if (this.filters.jabatan && rec.jabatan !== this.filters.jabatan) return false;
                        if (this.filters.status && rec.status !== this.filters.status) return false;
                        return true;
                    });
                },

                saveJabatan() {
                    if (!this.jabatanForm.name) return;
                    this.jabatanList.push(this.jabatanForm.name.trim());
                    localStorage.setItem('jabatanList', JSON.stringify(this.jabatanList));
                    this.jabatanForm.name = '';
                },
                deleteJabatan(i) { this.jabatanList.splice(i, 1); localStorage.setItem('jabatanList', JSON.stringify(this.jabatanList)); },

                saveEstafetArea() {
                    if (!this.estafetAreaForm.name) return;
                    this.estafetAreaList.push(this.estafetAreaForm.name.trim());
                    localStorage.setItem('estafetAreaList', JSON.stringify(this.estafetAreaList));
                    this.estafetAreaForm.name = '';
                },
                deleteEstafetArea(i) { this.estafetAreaList.splice(i, 1); localStorage.setItem('estafetAreaList', JSON.stringify(this.estafetAreaList)); },

                saveKurir() {
                    if (!this.kurirForm.name || !this.kurirForm.username) return;
                    this.kurirList.push({ ...this.kurirForm });
                    localStorage.setItem('kurirList', JSON.stringify(this.kurirList));
                    this.kurirForm = { name: '', username: '', password: '', kontrak: 'Full Time', jabatan: this.jabatanList[0] };
                    alert('Pegawai disimpan!');
                },
                deleteKurir(i) { this.kurirList.splice(i, 1); localStorage.setItem('kurirList', JSON.stringify(this.kurirList)); },

                async submitAbsen() {
                    if (!this.absenForm.capturedImage) { alert('Ambil foto kamera!'); return; }
                    let tglStr = new Date().toISOString().split('T')[0];
                    await this.sendToGoogleSheets('absen', {
                        tanggal: tglStr, name: this.currentUser.name, kontrak: this.currentUser.kontrak,
                        jabatan: this.currentUser.jabatan, absenType: this.absenForm.type, photoBase64: this.absenForm.capturedImage
                    });
                    this.absenForm.capturedImage = null;
                    this.initCamera();
                },

                async submitParkir() {
                    await this.sendToGoogleSheets('parkir', {
                        tanggal: this.parkirForm.tanggal, name: this.currentUser.name, kontrak: this.currentUser.kontrak,
                        jabatan: this.currentUser.jabatan, nominal: this.parkirForm.nominal, photoBase64: this.parkirForm.photo
                    });
                    this.parkirForm = { tanggal: '', nominal: 2000, photo: null };
                },

                async submitGedung() {
                    await this.sendToGoogleSheets('gedung', {
                        tanggal: this.gedungForm.tanggal, name: this.currentUser.name, kontrak: this.currentUser.kontrak,
                        jabatan: this.currentUser.jabatan, gedungLantai: this.gedungForm.gedungLantai,
                        namaCust: this.gedungForm.namaCust, sesi: this.gedungForm.sesi, photoBase64: this.gedungForm.photo
                    });
                    this.gedungForm = { tanggal: '', gedungLantai: '', namaCust: '', sesi: 'Lunch', photo: null };
                },

                async submitEstafet() {
                    await this.sendToGoogleSheets('estafet', {
                        tanggal: this.estafetForm.tanggal, name: this.currentUser.name, kontrak: this.currentUser.kontrak,
                        jabatan: this.currentUser.jabatan, estafetArea: this.estafetForm.estafetArea,
                        alasan: this.estafetForm.alasan, photoBase64: this.estafetForm.photo
                    });
                    this.estafetForm = { tanggal: '', estafetArea: '', alasan: '', photo: null };
                },

                async submitJarak() {
                    await this.sendToGoogleSheets('jarak', {
                        tanggal: this.jarakForm.tanggal, name: this.currentUser.name, kontrak: this.currentUser.kontrak,
                        jabatan: this.currentUser.jabatan, sesi: this.jarakForm.sesi, custTerjauh: this.jarakForm.custTerjauh,
                        jarak: this.jarakForm.jarak, photoBoxBase64: this.jarakForm.photoBox, photoBuktiBase64: this.jarakForm.photoBukti
                    });
                    this.jarakForm = { tanggal: '', sesi: 'Lunch', custTerjauh: '', jarak: '', photoBox: '', photoBukti: '' };
                },

                async submitPickup() {
                    await this.sendToGoogleSheets('ambil barang', {
                        tanggal: this.pickupForm.tanggal, name: this.currentUser.name, kontrak: this.currentUser.kontrak,
                        jabatan: this.currentUser.jabatan, deskripsi: this.pickupForm.deskripsi, photoBase64: this.pickupForm.photo
                    });
                    this.pickupForm = { tanggal: '', deskripsi: '', photo: null };
                }
            }
        }
    </script>
