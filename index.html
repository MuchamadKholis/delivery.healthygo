<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurirApp v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 font-sans" x-data="app()" x-init="initData()">

    <!-- LOGIN -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-blue-600 px-4">
            <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
                <h2 class="text-2xl font-bold text-center mb-6">Login KurirApp</h2>
                <form @submit.prevent="handleLogin" class="space-y-4">
                    <input type="text" x-model="loginInput.username" placeholder="Username" required class="w-full border rounded px-3 py-2">
                    <input type="password" x-model="loginInput.password" placeholder="Password" required class="w-full border rounded px-3 py-2">
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Masuk</button>
                </form>
            </div>
        </div>
    </template>

    <!-- DASHBOARD -->
    <template x-if="isLoggedIn">
        <div class="flex flex-col h-screen">
            <nav class="bg-blue-600 text-white p-4 flex justify-between">
                <h1 class="font-bold">KurirApp v1.0</h1>
                <button @click="logout()" class="bg-red-500 px-3 py-1 rounded text-sm">Logout</button>
            </nav>

            <div class="flex flex-1 overflow-hidden">
                <aside class="w-64 bg-white p-4 shadow overflow-y-auto">
                    <ul class="space-y-2">
                        <template x-if="role === 'admin'">
                            <div>
                                <li class="text-xs font-bold text-gray-400 uppercase mt-4">Rekapitulasi</li>
                                <li x-for="tab in ['absen', 'parkir', 'gedung', 'estafet', 'jarak', 'pickup']">
                                    <button @click="changeTab('rekap-'+tab)" class="w-full text-left p-2 rounded hover:bg-blue-50" x-text="'Rekap ' + tab"></button>
                                </li>
                            </div>
                        </template>
                        <template x-if="role === 'kurir'">
                            <li><button @click="changeTab('kurir-absen')" class="w-full text-left p-2 rounded hover:bg-blue-50">Absensi</button></li>
                        </template>
                    </ul>
                </aside>

                <main class="flex-1 p-6 overflow-y-auto">
                    <!-- Filter Admin -->
                    <div x-show="role === 'admin' && activeTab.startsWith('rekap-')" class="bg-white p-4 rounded shadow mb-4 grid grid-cols-4 gap-4">
                        <input type="date" x-model="filters.tanggal" class="border p-2 rounded text-sm">
                        <input type="text" x-model="filters.nama" placeholder="Cari Nama..." class="border p-2 rounded text-sm">
                        <select x-model="filters.status" class="border p-2 rounded text-sm">
                            <option value="">Semua Status</option>
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                        </select>
                    </div>

                    <!-- Tabel Absen Contoh -->
                    <div x-show="activeTab === 'rekap-absen'" class="bg-white shadow rounded overflow-hidden">
                        <table class="w-full text-sm">
                            <thead class="bg-gray-50 border-b">
                                <tr><th class="p-3">Tanggal</th><th class="p-3">Nama</th><th class="p-3">Datang</th><th class="p-3">Pulang</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr>
                            </thead>
                            <tbody>
                                <template x-for="rec in filteredAbsen()" :key="rec.key">
                                    <tr class="border-b">
                                        <td class="p-3" x-text="rec.date"></td>
                                        <td class="p-3" x-text="rec.name"></td>
                                        <td class="p-3" x-text="rec.timeDatang"></td>
                                        <td class="p-3" x-text="rec.timePulang"></td>
                                        <td class="p-3" x-text="rec.status"></td>
                                        <td class="p-3 space-x-2">
                                            <button @click="updateStatus('absen', rec.rowIndex, 'Approved')" class="text-green-600">Approve</button>
                                            <button @click="updateStatus('absen', rec.rowIndex, 'Rejected')" class="text-red-600">Reject</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </main>
            </div>
        </div>
    </template>

    <script>
        function app() {
            return {
                isLoggedIn: false, role: 'admin', activeTab: 'rekap-absen', isLoading: false,
                gasUrl: 'https://script.google.com/macros/s/AKfycby16c3G39W5itSTX__6GBv0R6hSKq8RdOIlZhiy8MVuCZBrQhjNNk7jo-GpbJuldh8gOw/exec',
                cloudSheets: { absen: [], parkir: [], gedung: [], estafet: [], jarak: [], 'ambil barang': [] },
                filters: { tanggal: '', nama: '', status: '' },
                
                async initData() {
                    if (this.role === 'admin') {
                        await this.fetchCloudData();
                        setInterval(() => this.fetchCloudData(), 15000);
                    }
                },
                
                async fetchCloudData() {
                    let res = await fetch(this.gasUrl + "?action=getData");
                    this.cloudSheets = await res.json();
                },

                changeTab(tab) {
                    this.activeTab = tab;
                    if (tab === 'kurir-absen') this.initCamera();
                    else this.stopCamera();
                },

                async updateStatus(sheetName, rowIndex, newStatus, nominal = null) {
                    await fetch(this.gasUrl, {
                        method: 'POST', mode: 'no-cors',
                        body: JSON.stringify({ action: 'updateStatus', sheetName, rowIndex, status: newStatus, nominal })
                    });
                    this.fetchCloudData();
                },

                filteredAbsen() {
                    let rows = this.cloudSheets.absen || [];
                    let map = {};
                    for (let i = 1; i < rows.length; i++) {
                        let r = rows[i];
                        let key = r[1] + r[0];
                        if (!map[key]) map[key] = { key, date: r[0], name: r[1], timeDatang: r[4], timePulang: r[6], status: r[8], rowIndex: i + 1 };
                        else { map[key].timePulang = r[6]; map[key].rowIndex = i + 1; }
                    }
                    return Object.values(map).filter(rec => {
                        return (!this.filters.nama || rec.name.toLowerCase().includes(this.filters.nama.toLowerCase())) &&
                               (!this.filters.status || rec.status === this.filters.status);
                    });
                },

                initCamera() {
                    navigator.mediaDevices.getUserMedia({ video: true }).then(s => {
                        document.getElementById('cameraStream').srcObject = s;
                    });
                },

                stopCamera() {
                    let stream = document.getElementById('cameraStream')?.srcObject;
                    if(stream) stream.getTracks().forEach(t => t.stop());
                },
                
                logout() { this.isLoggedIn = false; this.stopCamera(); }
            }
        }
    </script>
</body>
</html>
